    <style>
      body { margin: 0; background: #09080d; }
      #startup-static {
        position: fixed;
        inset: 0;
        z-index: 9998;
        overflow: hidden;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 48%, rgba(52,44,70,0.28), transparent 45%),
          linear-gradient(135deg, #0e0d14, #09080d 72%);
      }
      #startup-static::after {
        content: "";
        position: absolute;
        inset: -20%;
        background: linear-gradient(115deg, transparent 42%, rgba(255,255,255,0.11) 50%, transparent 58%);
        transform: translateX(-64%);
        animation: ss-sweep 1.2s cubic-bezier(0.22,1,0.36,1) 0.1s forwards;
        pointer-events: none;
      }
      #startup-static .s-tint {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 50% 46%, rgba(255,255,255,0.016), transparent 20%),
          linear-gradient(180deg, rgba(9,8,13,0.28), rgba(9,8,13,0.62) 72%, rgba(9,8,13,0.82)),
          linear-gradient(90deg, rgba(9,8,13,0.58), rgba(9,8,13,0.1) 50%, rgba(9,8,13,0.58));
        pointer-events: none;
      }
      #startup-static svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      #startup-static .s-id {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }
      #startup-static .s-logo {
        width: 96px;
        height: 96px;
        object-fit: contain;
        filter: drop-shadow(0 8px 24px rgba(0,0,0,0.8)) drop-shadow(0 0 36px rgba(160,80,255,0.22));
      }
      #startup-static .s-line {
        width: 240px;
        height: 2px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255,255,255,0.12);
      }
      #startup-static .s-line span {
        display: block;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
        transform: translateX(-115%);
        animation: ss-line 1.8s cubic-bezier(0.22,1,0.36,1) infinite;
      }
      #startup-static .s-status {
        margin: 0;
        color: rgba(255,255,255,0.42);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-family: system-ui, sans-serif;
      }
      @keyframes ss-line {
        0% { transform: translateX(-115%); }
        72%, to { transform: translateX(115%); }
      }
      @keyframes ss-sweep {
        to { transform: translateX(64%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #startup-static .s-line span, #startup-static::after { animation: none; }
        #startup-static .s-line span { transform: translateX(0); opacity: 0.5; }
      }
    </style>
